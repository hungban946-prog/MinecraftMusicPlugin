name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: ai-chat-app
        run: npm ci

      - name: Generate Android project
        working-directory: ai-chat-app
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: ai-chat-app
        run: ./android/gradlew --project-dir android assembleDebug

      - name: Name APK
        working-directory: ai-chat-app
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ai-chat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-apk
          path: ai-chat-app/ai-chat.apk
          if-no-files-found: error

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ai-chat-app/ai-chat.apk
          generate_release_notes: true
